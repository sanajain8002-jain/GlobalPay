name: GlobalPay 2.0 Multi-Language CI (Node, Python & Java)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run Node.js Backend & Financial State Machine Tests
        run: node --test tests/run_tests.mjs

      - name: Run Python Analytics & FX Quote Engine
        run: python3 services/python_analytics/ledger_engine.py

      - name: Compile & Run Java 17 Settlement Engine
        run: |
          javac services/java_settlement/src/com/globalpay/settlement/GlobalPaySettlementEngine.java
          java -cp services/java_settlement/src com.globalpay.settlement.GlobalPaySettlementEngine
