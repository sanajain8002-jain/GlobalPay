<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#6D28D9" />
<link rel="icon" type="image/png" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="GlobalPay" />
<title>GlobalPay — Money moves. You move.</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#F3F1FD;--surface:#FFFFFF;--surface2:#F7F5FF;--text:#171236;--muted:#6E6A93;--border:#E7E3F8;
  --brand:#6D28D9;--brand-d:#4C1D95;--brand-soft:#EEE9FF;--ok:#10B981;--ok-soft:#D9F7EA;
  --warn:#D97706;--warn-soft:#FEF3C7;--bad:#E11D48;--bad-soft:#FFE4E8;--nav:#1A1444;
  --shadow:0 8px 28px rgba(76,29,149,.10);--r:18px;
}
[data-theme="dark"],.force-dark{
  --bg:#0B0818;--surface:#150F2E;--surface2:#1D1642;--text:#F5F3FF;--muted:#A9A3D0;--border:#2C2358;
  --brand-soft:#2B2062;--ok-soft:#0E3B2F;--warn-soft:#42300B;--bad-soft:#431224;--warn:#FBBF24;--bad:#FB7185;
  --shadow:0 8px 28px rgba(0,0,0,.40);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.4;font-size:15px;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--brand);text-decoration:none}
.ic{flex:none;display:block}
.muted{color:var(--muted)}.small{font-size:12.5px}.tiny{font-size:11.5px}.bold{font-weight:700}.right{text-align:right}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.grow{flex:1;min-width:0}
.col{display:flex;flex-direction:column}.gap8{gap:8px}.gap12{gap:12px}.gap16{gap:16px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hide{display:none!important}

/* ---------- buttons / inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 22px;border-radius:14px;font-weight:700;color:#fff;background:linear-gradient(135deg,#7C3AED,#5B21B6);box-shadow:0 8px 18px rgba(109,40,217,.28);transition:transform .12s,filter .12s}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.98)}
.btn.block{width:100%}.btn.sm{padding:9px 14px;font-size:13.5px;border-radius:11px}
.btn.ghost{background:var(--surface);color:var(--brand);box-shadow:none;border:1.5px solid var(--border)}
.btn.light{background:#fff;color:#4C1D95;box-shadow:0 8px 18px rgba(0,0,0,.18)}
.btn.danger{background:var(--bad-soft);color:var(--bad);box-shadow:none}
.btn[disabled]{opacity:.5;pointer-events:none}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>label{font-size:12.5px;font-weight:600;color:var(--muted)}
.input,select.input,textarea.input{width:100%;padding:13px 14px;border-radius:13px;border:1.5px solid var(--border);background:var(--surface);outline:none;transition:border-color .15s,box-shadow .15s}
.input:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(109,40,217,.12)}
.input-wrap{position:relative}.input-wrap .input{padding-right:46px}
.input-wrap .adorn{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--muted);padding:6px}
.search{position:relative}.search .ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search .input{padding-left:40px;border-radius:14px}
.err{color:var(--bad);font-size:12.5px;margin-top:6px;font-weight:600}
.check{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.check input{accent-color:var(--brand);width:16px;height:16px}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card h3,.sec-title{font-size:15.5px;font-weight:700}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 10px}
.sec-head a,.link{font-size:12.5px;font-weight:600;color:var(--brand);cursor:pointer}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:999px;font-size:13px;font-weight:600;background:var(--surface);border:1px solid var(--border);color:var(--muted);white-space:nowrap}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700}
.b-ok{background:var(--ok-soft);color:#0B8A5F}.b-warn{background:var(--warn-soft);color:var(--warn)}.b-bad{background:var(--bad-soft);color:var(--bad)}.b-info{background:var(--brand-soft);color:var(--brand)}
[data-theme="dark"] .b-ok{color:#34D399}
.avatar{border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none;letter-spacing:.3px}
.flag{border-radius:50%;flex:none;display:block;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.list-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);cursor:pointer;width:100%;text-align:left}
.list-row:last-child{border-bottom:0}
.amt-neg{color:var(--text);font-weight:700}.amt-pos{color:var(--ok);font-weight:700}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:3px}
.seg button{padding:7px 16px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--brand);color:#fff}
.toggle{width:44px;height:26px;border-radius:999px;background:var(--border);position:relative;transition:background .2s;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.toggle.on{background:var(--brand)}.toggle.on::after{transform:translateX(18px)}
.progress{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;border:1px solid var(--border)}
.progress>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#8B5CF6,#6D28D9)}
.progress.hot>i{background:linear-gradient(90deg,#FB7185,#E11D48)}

/* ---------- app shell ---------- */
.app{min-height:100vh;display:flex}
.sidebar{display:none}
.main{flex:1;min-width:0;padding-bottom:96px}
.topbar{display:none}
.content{padding:16px;max-width:720px;margin:0 auto}
.page-head{display:flex;align-items:center;gap:12px;margin:2px 0 16px}
.page-head h1{font-size:20px;font-weight:800;flex:1;letter-spacing:-.2px}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--border);color:var(--text);position:relative}
.dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--bad);border:2px solid var(--surface)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;align-items:flex-end;justify-content:space-around;background:var(--surface);border-top:1px solid var(--border);padding:6px 6px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -8px 24px rgba(76,29,149,.08)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 0}
.tab.on{color:var(--brand)}
.tab.fab{margin-top:-30px}
.tab.fab .fab-btn{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#8B5CF6,#5B21B6);box-shadow:0 10px 22px rgba(109,40,217,.5);border:4px solid var(--surface)}

/* ---------- home ---------- */
.home-top{background:linear-gradient(160deg,#2A0F5E 0%,#3B1590 55%,#4C1D95 100%);color:#fff;margin:-16px -16px 0;padding:calc(18px + env(safe-area-inset-top)) 16px 22px;border-radius:0 0 30px 30px}
.greet{display:flex;align-items:center;justify-content:space-between}
.greet h2{font-size:18px;font-weight:700}.greet p{font-size:12.5px;opacity:.75}
.balance{position:relative;overflow:hidden;border-radius:22px;padding:18px;color:#fff;background:linear-gradient(135deg,#6D28D9 0%,#5B21B6 55%,#7C3AED 100%);box-shadow:0 14px 30px rgba(76,29,149,.35)}
.balance::before,.balance::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.10)}
.balance::before{width:190px;height:190px;right:-60px;top:-70px}.balance::after{width:140px;height:140px;right:30px;bottom:-90px;background:rgba(255,255,255,.07)}
.balance>*{position:relative;z-index:1}
.balance .lbl{font-size:13px;opacity:.85;display:flex;align-items:center;gap:8px}
.balance .big{font-size:34px;font-weight:800;letter-spacing:-.8px;margin:6px 0 4px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:999px;background:rgba(255,255,255,.18);font-size:12.5px;font-weight:700;color:#fff;border:0}
.pill select{background:transparent;border:0;color:#fff;font-weight:700;outline:none;appearance:none;-webkit-appearance:none;cursor:pointer}
.pill select option{color:#171236}
.up{color:#6EE7B7;font-size:12.5px;font-weight:600}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}
.qa button{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--text)}
.qa .q-ic{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,#8B5CF6,#5B21B6);box-shadow:0 8px 16px rgba(109,40,217,.3)}
.contacts{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}.contacts::-webkit-scrollbar{display:none}
.contact{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;min-width:58px}
.home-grid{display:grid;gap:0}
.home-grid>*,.two>*,.home-hero>*{min-width:0}
.two>.card{align-self:start}
.stepper{max-width:640px}
.main,.content{max-width:100%}
.rate-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);font-size:13.5px}
.rate-row:last-child{border:0}
.promo{border-radius:20px;padding:20px;color:#fff;background:linear-gradient(135deg,#5B21B6,#7C3AED);position:relative;overflow:hidden}
.promo::after{content:"";position:absolute;right:-30px;bottom:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.12)}
.promo h3{font-size:18px;margin-bottom:12px;max-width:80%}
.sandbox-tag{font-size:11px;font-weight:700;letter-spacing:.4px;padding:4px 10px;border-radius:999px;background:var(--warn-soft);color:var(--warn);display:inline-flex;align-items:center;gap:6px}

/* ---------- stepper & flows ---------- */
.stepper{display:flex;align-items:center;margin:4px 0 20px}
.stepper .st{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;color:var(--muted);font-weight:600}
.stepper .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--surface);border:1.5px solid var(--border);color:var(--muted)}
.stepper .st.on .n{background:var(--brand);border-color:var(--brand);color:#fff}
.stepper .st.on{color:var(--brand)}
.stepper .st.done .n{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
.stepper i{flex:1;height:2px;background:var(--border);margin:0 8px 18px}.stepper i.on{background:var(--brand)}
.country{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left;border:1.5px solid var(--border);border-radius:14px;background:var(--surface);margin-bottom:8px}
.country.on{border-color:var(--brand);background:var(--brand-soft)}
.country .radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--border);display:grid;place-items:center;color:#fff}
.country.on .radio{background:var(--brand);border-color:var(--brand)}
.two{display:grid;gap:16px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px dashed var(--border);font-size:14px}
.kv:last-child{border:0}.kv span:first-child{color:var(--muted)}.kv span:last-child{font-weight:700;text-align:right}
.kv.total{font-size:16px}.kv.total span:last-child{color:var(--brand)}
.amount-input{font-size:38px;font-weight:800;border:0;background:transparent;outline:none;width:100%;letter-spacing:-1px}
.secure{display:flex;gap:10px;align-items:center;background:var(--brand-soft);border-radius:14px;padding:12px 14px;color:var(--brand);font-size:12.5px;font-weight:600}
.success-wrap{text-align:center;padding-top:10px}
.success-ic{width:92px;height:92px;border-radius:50%;margin:8px auto 14px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#8B5CF6,#5B21B6);box-shadow:0 0 0 12px var(--brand-soft),0 14px 30px rgba(109,40,217,.35);animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}

/* ---------- donut ---------- */
.donut{position:relative;width:170px;height:170px;flex:none}
.donut svg{transform:rotate(-90deg)}
.donut .mid{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.legend{display:flex;flex-direction:column;gap:9px;font-size:13px}
.legend .lg{display:flex;align-items:center;gap:8px}.legend i{width:9px;height:9px;border-radius:50%}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{padding:14px;border-radius:16px;border:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;gap:6px}
.tile b{font-size:17px}

/* ---------- chat (dark) ---------- */
.chat-page{background:var(--bg);color:var(--text);border-radius:22px;padding:16px;min-height:70vh;display:flex;flex-direction:column}
.bubble{max-width:86%;padding:12px 14px;border-radius:16px;font-size:14px;line-height:1.5}
.bubble.me{align-self:flex-end;background:linear-gradient(135deg,#7C3AED,#5B21B6);color:#fff;border-bottom-right-radius:4px}
.bubble.ai{align-self:flex-start;background:var(--surface2);border:1px solid var(--border);border-bottom-left-radius:4px}
.chat-log{display:flex;flex-direction:column;gap:12px;flex:1;margin:14px 0}
.sugg{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.sugg button{padding:9px 14px;border:1px solid #6D5BD0;border-radius:999px;font-size:13px;color:#DCD4FF;background:rgba(109,40,217,.15)}
.chat-in{display:flex;gap:8px;align-items:center;background:var(--surface2);border:1px solid var(--border);border-radius:16px;padding:6px 6px 6px 14px}
.chat-in input{flex:1;background:transparent;border:0;outline:none;padding:8px 0}

/* ---------- scan (dark) ---------- */
.scan-page{border-radius:22px;padding:18px;background:#0B0818;color:#fff;min-height:74vh}
.viewfinder{position:relative;margin:18px auto;width:min(290px,78vw);aspect-ratio:1;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#2a2350,#0f0b24)}
.viewfinder .c{position:absolute;width:44px;height:44px;border:4px solid #fff;border-radius:14px}
.c.tl{top:-6px;left:-6px;border-right:0;border-bottom:0}.c.tr{top:-6px;right:-6px;border-left:0;border-bottom:0}
.c.bl{bottom:-6px;left:-6px;border-right:0;border-top:0}.c.br{bottom:-6px;right:-6px;border-left:0;border-top:0}
.qrbox{background:#fff;padding:12px;border-radius:12px;width:62%}
.scanline{position:absolute;left:8%;right:8%;height:3px;background:linear-gradient(90deg,transparent,#A78BFA,transparent);animation:scan 2.4s ease-in-out infinite}
@keyframes scan{0%,100%{top:12%}50%{top:86%}}
.scan-actions{display:flex;justify-content:center;gap:48px;margin:14px 0 20px}
.scan-actions button{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12.5px;color:#D9D3FF}
.scan-actions .ci{width:54px;height:54px;border-radius:50%;background:#1D1642;display:grid;place-items:center}
.upi-box{background:#150F2E;border:1px solid #2C2358;border-radius:18px;padding:16px}
.upi-box .input{background:#0B0818;border-color:#2C2358;color:#fff}

/* ---------- sheet ---------- */
.sheet-bg{position:fixed;inset:0;background:rgba(10,6,30,.55);z-index:80;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--surface);color:var(--text);width:100%;max-width:520px;border-radius:26px 26px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet h3{font-size:18px;margin-bottom:14px}
.grab{width:42px;height:4px;border-radius:9px;background:var(--border);margin:-6px auto 14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:100px;background:#171236;color:#fff;padding:12px 18px;border-radius:14px;font-size:13.5px;font-weight:600;z-index:90;box-shadow:0 10px 28px rgba(0,0,0,.35);max-width:90vw;animation:up .2s}

/* ---------- welcome / auth ---------- */
.welcome{min-height:100vh;color:#fff;background:radial-gradient(120% 70% at 50% 0%,#5B21B6 0%,#2A0F5E 55%,#12082E 100%);padding:calc(20px + env(safe-area-inset-top)) 22px 28px;display:flex;flex-direction:column;overflow:hidden;position:relative}
.land-nav{display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.3px}
.logo .mark{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,#A78BFA,#6D28D9);color:#fff;font-weight:800;font-size:15px}
.land-links{display:none}
.hero{flex:1;display:flex;flex-direction:column;justify-content:center;gap:10px;position:relative}
.hero h1{font-size:44px;line-height:1.05;font-weight:800;letter-spacing:-1.4px}
.hero h1 span{background:linear-gradient(90deg,#C4B5FD,#F0ABFC);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .tag{font-size:16px;opacity:.9;font-weight:500}
.hero .sub{opacity:.75;max-width:460px;font-size:14.5px}
.hero-art{width:min(360px,80vw);margin:6px auto 0}
.hero-btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
.features{display:none}
.welcome .foot{text-align:center;font-size:12.5px;opacity:.75;margin-top:14px}
.auth{min-height:100vh;display:flex}
.auth-art{display:none}
.auth-card{flex:1;padding:calc(30px + env(safe-area-inset-top)) 22px 30px;max-width:480px;margin:0 auto;width:100%;display:flex;flex-direction:column;justify-content:center}
.divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12.5px;margin:18px 0}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border)}

/* ---------- desktop ---------- */
@media (min-width:960px){
  .main{padding-bottom:40px}
  .tabbar{display:none}
  .sidebar{display:flex;flex-direction:column;width:244px;flex:none;position:sticky;top:0;height:100vh;background:var(--nav);color:#fff;padding:22px 14px}
  .sidebar .logo{padding:2px 8px 22px;font-size:19px}
  .nav-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;color:#BDB6EA;font-weight:600;font-size:14px;width:100%;text-align:left;position:relative}
  .nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
  .nav-item.on{background:linear-gradient(135deg,#7C3AED,#5B21B6);color:#fff;box-shadow:0 8px 18px rgba(109,40,217,.4)}
  .nav-item .nb{margin-left:auto;background:var(--bad);color:#fff;font-size:11px;border-radius:99px;padding:1px 7px}
  .side-user{margin-top:14px;padding:12px;border-radius:14px;background:rgba(255,255,255,.07);display:flex;gap:10px;align-items:center}
  .topbar{display:flex;align-items:center;gap:14px;padding:18px 32px;position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px)}
  .topbar .search{flex:1;max-width:520px}
  .content{max-width:1240px;padding:8px 32px 32px}
  .home-top{background:none;color:var(--text);margin:0;padding:0;border-radius:0}
  .home-top .greet{display:none}

function quote(src, dst, sendMajor) {
  var same = src === dst;
  var cf = same ? { fix: 0, pct: 0, mk: 0, delivery: 'Instant', rail: 'GlobalPay P2P' } : (CORR[dst] || CORR._);
  var mid = RATES[dst] / RATES[src];
  var fee = cf.fix * RATES[src] + sendMajor * cf.pct / 1e4;
  var mk = sendMajor * cf.mk / 1e4;
  var q = { src: src, dst: dst, mid: mid, delivery: cf.delivery, rail: cf.rail, same: same };
  q.send = rnd(sendMajor, src); q.fee = rnd(fee, src); q.mk = rnd(mk, src);
  q.total = q.send + q.fee + q.mk; q.recv = rnd(sendMajor * mid, dst);
  return q;
}
function validateQuote(q, acc) {
  var usd = toUSD(q.send, q.src);
  if (!q.send) return 'Enter an amount to send.';
  if (usd < 1) return 'Minimum transfer is about $1.00.';
  if (usd > 10000) return 'Maximum single transfer is about $10,000.00.';
  if (!acc || q.total > acc.bal) return 'Insufficient balance in your ' + q.src + ' wallet.';
  return '';
}
function commitPayment(o) {
  var acc = acct(o.src); if (!acc || o.total > acc.bal) return null;
  acc.bal -= o.total;
  var t = {
    id: uid('tx'), userId: state.session, status: 'Completed', time: new Date().toISOString(),
    title: o.title, sub: o.sub, cat: o.cat, kind: o.kind, amt: -o.total, cur: o.src,
    sendAmt: o.send, fee: o.fee + (o.mk || 0), recvAmt: o.recv, recvCur: o.dst, rate: o.mid, delivery: o.delivery, note: o.note || '', country: o.country || ''
  };
  var d = new Date();
  t.ref = 'GP-' + d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0') + '-' + Math.random().toString(36).slice(2, 8).toUpperCase();
  state.tx.unshift(t);
  state.notes.unshift({ id: uid('n'), userId: state.session, title: 'Payment sent', msg: fmt(o.total, o.src) + ' paid to ' + o.title + '.', time: t.time, read: false });
  save(); return t;
}
function spendByCat() {
  var now = new Date(), out = {};
  mine('tx').forEach(function (t) {
    if (t.amt >= 0 || t.status === 'Failed') return;
    var d = new Date(t.time); if (ui.spendRange === 'month' && (d.getMonth() !== now.getMonth() || d.getFullYear() !== now.getFullYear())) return;
    var c = t.cat === 'Transfers' ? 'Others' : (t.cat || 'Others');
    out[c] = (out[c] || 0) + toUSD(-t.amt, t.cur);
  });
  var arr = Object.keys(out).map(function (k) { return { cat: k, usd: out[k] }; }).sort(function (a, b) { return b.usd - a.usd; });
  var tot = arr.reduce(function (s, x) { return s + x.usd; }, 0);
  arr.forEach(function (x, i) { x.pct = tot ? x.usd / tot * 100 : 0; x.color = CAT_COLORS[i % CAT_COLORS.length]; });
  return { items: arr, total: tot };
}

    case 'addbudget': openSheet('<div class="grab"></div><h3>New budget</h3><form data-form="budget"><div class="field"><label>Category</label><select class="input" name="cat">' + ['Food & Drinks', 'Shopping', 'Travel', 'Entertainment', 'Utilities'].map(function (c) { return '<option>' + c + '</option>'; }).join('') + '</select></div><div class="field"><label>Monthly limit (USD)</label><input class="input" name="limit" inputmode="decimal" placeholder="300" required /></div><div id="sheet-err"></div><button class="btn block" type="submit">Save budget</button></form>'); break;
    case 'delbudget': state.budgets = state.budgets.filter(function (b) { return b.id !== el.dataset.id; }); save(); render(); break;
    case 'addcontact': openSheet('<div class="grab"></div><h3>Add recipient</h3><form data-form="contact"><div class="field"><label>Full name</label><input class="input" name="name" required /></div><div class="field"><label>Country</label><select class="input" name="country">' + COUNTRIES.map(function (c) { return '<option value="' + c.code + '">' + c.name + '</option>'; }).join('') + '</select></div><div class="field"><label>Account / UPI / IBAN</label><input class="input" name="acct" required /></div><button class="btn block" type="submit">Save recipient</button></form>'); break;
    case 'delcontact': state.contacts = state.contacts.filter(function (x) { return x.id !== el.dataset.id; }); save(); render(); break;
    case 'paybill': var b = state.bills.filter(function (x) { return x.id === el.dataset.id; })[0], qb = quote('USD', 'USD', b.amt / 100);
      var tb = commitPayment({ src: 'USD', dst: 'USD', send: qb.send, fee: 0, mk: 0, total: qb.send, recv: qb.send, mid: 1, delivery: 'Instant', title: b.title, sub: b.cat, cat: b.cat, kind: 'BILL' });
      if (!tb) { toast('Insufficient USD balance.'); break; } state.bills = state.bills.filter(function (x) { return x.id !== b.id; }); save(); toast(b.title + ' paid.'); render(); break;
    case 'newrequest': openSheet('<div class="grab"></div><h3>Request money</h3><form data-form="request"><div class="field"><label>From</label><select class="input" name="name">' + mine('contacts').map(function (c) { return '<option>' + esc(c.name) + '</option>'; }).join('') + '</select></div><div class="field"><label>Amount (USD)</label><input class="input" name="amt" inputmode="decimal" required /></div><div class="field"><label>Note</label><input class="input" name="note" /></div><button class="btn block" type="submit">Send request</button></form>'); break;
    case 'payreq': var r = state.requests.filter(function (x) { return x.id === el.dataset.id; })[0], qr = quote('USD', 'USD', r.amt / 100);
      var tr = commitPayment({ src: 'USD', dst: 'USD', send: qr.send, fee: 0, mk: 0, total: qr.send, recv: qr.send, mid: 1, delivery: 'Instant', title: r.name, sub: 'Request paid', cat: 'Transfers', kind: 'SEND', note: r.note });
      if (!tr) { toast('Insufficient USD balance.'); break; } r.status = 'Paid'; save(); toast('Request paid.'); render(); break;
    case 'declinereq': case 'cancelreq': state.requests.filter(function (x) { return x.id === el.dataset.id; })[0].status = a === 'declinereq' ? 'Declined' : 'Cancelled'; save(); render(); break;
    case 'swapconv': var cv = ui.conv; var tmp = cv.from; cv.from = cv.to; cv.to = tmp; render(); break;
    case 'setto': ui.conv.to = el.dataset.c; render(); break;
    case 'saveconv': var c3 = ui.conv, o = parseAmt(c3.amt) * RATES[c3.to] / RATES[c3.from]; state.convs.unshift({ from: c3.from, to: c3.to, amt: parseAmt(c3.amt).toFixed(2), out: o.toLocaleString('en-US', { maximumFractionDigits: 2 }), rate: (RATES[c3.to] / RATES[c3.from]).toFixed(4), time: new Date().toISOString() }); save(); toast('Conversion saved.'); render(); break;
    case 'ask': askCopilot(el.dataset.q); break;
    case 'clearchat': state.chat = []; save(); render(); break;
    case 'toggle': var u = me(); u[el.dataset.k] = !u[el.dataset.k]; save(); render(); break;
    case 'theme': state.theme = el.dataset.t; save(); render(); break;
    case 'readall': mine('notes').forEach(function (n) { n.read = true; }); save(); render(); break;
    case 'notifs': go('notifications'); break;
    case 'recips': go('global?tab=recipients'); break;
    case 'classic': location.href = 'classic.html'; break;
    case 'help': openSheet('<div class="grab"></div><h3>Help & Support</h3><p class="muted small">This is a sandbox demo. No real payments are processed and no real support team is connected.</p><div class="kv mt12"><span>Fees</span><span>Shown before you confirm</span></div><div class="kv"><span>Data</span><span>Stored only in this browser</span></div><button class="btn block mt16" data-act="closesheet2">Got it</button>'); break;
    case 'closesheet2': closeSheet(); break;
    case 'editprofile': var u2 = me(); openSheet('<div class="grab"></div><h3>Personal details</h3><form data-form="profile"><div class="field"><label>Full name</label><input class="input" name="name" value="' + esc(u2.name) + '" required /></div><div class="field"><label>Email</label><input class="input" name="email" type="email" value="' + esc(u2.email) + '" required /></div><div class="field"><label>Phone</label><input class="input" name="phone" value="' + esc(u2.phone) + '" /></div><button class="btn block" type="submit">Save</button></form>'); break;
    case 'csv': exportCsv(); break;
    case 'soon': toast((el.dataset.l || 'This') + ' — not available in the sandbox demo.'); break;
  }
});
root.addEventListener('input', function (e) {
  var t = e.target, k = t.dataset && t.dataset.live; if (!k) return; var f = ui.flow;
  if (k === 'cs') { f.cs = t.value; var pos = t.selectionStart; render(); var n = $('[data-live=cs]'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (x) {} } }
  else if (k === 'amt') { f.amt = t.value; recompute(f); var qb = $('#quote-box'); if (qb) qb.innerHTML = quoteBox(f); }
  else if (k === 'note') f.note = t.value;
  else if (k === 'from') { f.from = t.value; render(); }
  else if (k === 'actq') { ui.actQ = t.value; var l = $('#tx-list'); if (l) l.innerHTML = txListHtml(); }
  else if (k === 'cfrom' || k === 'cto' || k === 'camt') { var cv = ui.conv; if (k === 'cfrom') cv.from = t.value; if (k === 'cto') cv.to = t.value; if (k === 'camt') cv.amt = t.value; var r = RATES[cv.to] / RATES[cv.from], out = parseAmt(cv.amt) * r; $('#conv-out').textContent = out ? out.toLocaleString('en-US', { maximumFractionDigits: CUR[cv.to].dec, minimumFractionDigits: CUR[cv.to].dec }) : '0'; $('#conv-rate').textContent = 'Indicative mid-market rate: 1 ' + cv.from + ' = ' + (r >= 100 ? r.toFixed(2) : r.toFixed(4)) + ' ' + cv.to; }
});
root.addEventListener('change', function (e) { var t = e.target; if (t.dataset && (t.dataset.live === 'cfrom' || t.dataset.live === 'cto')) { /* handled by input */ } });
root.addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target.id === 'top-search') { go('activity?q=' + encodeURIComponent(e.target.value)); } });
root.addEventListener('submit', function (e) {
  e.preventDefault(); var form = e.target, k = form.dataset.form, d = {}; new FormData(form).forEach(function (v, n) { d[n] = String(v).trim(); });
  var f = ui.flow;
  if (k === 'login') { var u = state.users.filter(function (x) { return x.email.toLowerCase() === d.email.toLowerCase(); })[0]; if (!u || u.pass !== hash(d.pw)) { $('#auth-err').innerHTML = '<div class="err" style="margin-bottom:10px">Incorrect email or password.</div>'; return; } state.session = u.id; save(); go('home'); render(); }
  else if (k === 'signup') {
    if (state.users.some(function (x) { return x.email.toLowerCase() === d.email.toLowerCase(); })) { $('#auth-err').innerHTML = '<div class="err" style="margin-bottom:10px">That email is already registered.</div>'; return; }
    if (d.pw.length < 8) { $('#auth-err').innerHTML = '<div class="err" style="margin-bottom:10px">Password must be at least 8 characters.</div>'; return; }
    var id = uid('u'); state.users.push({ id: id, name: d.name, email: d.email, phone: '', country: 'US', pass: hash(d.pw), mfa: false, bio: false, kyc: false });
    state.accounts.push({ id: uid('a'), userId: id, cur: 'USD', bal: 100000 }, { id: uid('a'), userId: id, cur: 'EUR', bal: 0 }, { id: uid('a'), userId: id, cur: 'INR', bal: 0 });
    state.notes.push({ id: uid('n'), userId: id, title: 'Welcome to GlobalPay', msg: 'Your sandbox wallet has been funded with $1,000.', time: new Date().toISOString(), read: false });
    state.session = id; save(); go('home'); render();
  }
  else if (k === 'recipient') { f.name = d.name; f.method = d.method; f.acct = d.acct; f.note = d.note; if (!d.name || !d.acct) { stepErr('Recipient name and account are required.'); return; } f.step = 2; render(); }
  else if (k === 'upi') { openSheet(payeeSheet(d.upi.split('@')[0] || d.upi, d.upi)); }
  else if (k === 'qrpay') {
    var v = parseAmt(d.amt), qq = quote(d.from, d.from, v), er = validateQuote(qq, acct(d.from)); if (er) { $('#sheet-err').innerHTML = '<div class="err" style="margin-bottom:10px">' + esc(er) + '</div>'; return; }
    var t = commitPayment({ src: d.from, dst: d.from, send: qq.send, fee: 0, mk: 0, total: qq.send, recv: qq.send, mid: 1, delivery: 'Instant', title: form.dataset.name, sub: 'QR Payment', cat: form.dataset.name === 'Coffee House' ? 'Food & Drinks' : 'Shopping', kind: 'PAY' });
    closeSheet(); ui.flow = null; go('receipt/' + t.id); render();
  }
  else if (k === 'addmoney') { var amt = parseAmt(d.amt); if (!amt) { $('#sheet-err').innerHTML = '<div class="err" style="margin-bottom:10px">Enter an amount.</div>'; return; } acct(d.cur).bal += rnd(amt, d.cur); save(); closeSheet(); toast('Sandbox funds added.'); render(); }
  else if (k === 'budget') { var lim = parseAmt(d.limit); if (!lim) return; state.budgets.push({ id: uid('g'), userId: state.session, cat: d.cat, limit: Math.round(lim * 100) }); save(); closeSheet(); render(); }
  else if (k === 'contact') { state.contacts.push({ id: uid('c'), userId: state.session, name: d.name, country: d.country, acct: d.acct, method: 'Bank Transfer (SWIFT)' }); save(); closeSheet(); render(); }
  else if (k === 'request') { var ra = parseAmt(d.amt); if (!ra) return; state.requests.unshift({ id: uid('r'), userId: state.session, dir: 'out', name: d.name, amt: Math.round(ra * 100), cur: 'USD', note: d.note, status: 'Pending', time: new Date().toISOString() }); save(); closeSheet(); ui.reqTab = 'out'; render(); }
  else if (k === 'profile') { var uu = me(); uu.name = d.name; uu.email = d.email; uu.phone = d.phone; save(); closeSheet(); toast('Profile updated.'); render(); }
  else if (k === 'chat') { if (d.q) askCopilot(d.q); }
});

function demoLogin() { var u = state.users.filter(function (x) { return x.email === 'demo@globalpay.app'; })[0]; if (!u) { state = seedState(); u = state.users[0]; } state.session = u.id; save(); go('home'); render(); }
function askCopilot(q) { state.chat = state.chat.length ? state.chat : [{ r: 'ai', t: 'Hi ' + esc(me().name.split(' ')[0]) + '! I\'m GP Copilot (rule-based sandbox assistant). Ask about your spending, budgets, transfer fees or pending payments.' }]; state.chat.push({ r: 'me', t: q }, { r: 'ai', t: copilotReply(q) }); save(); render(); }
function receiptText(t) { return ['GlobalPay receipt (sandbox)', 'Reference: ' + t.ref, 'To: ' + t.title, 'Amount: ' + fmt(-t.amt, t.cur).replace('-', ''), 'Fee: ' + fmt(t.fee || 0, t.cur), 'Date: ' + new Date(t.time).toLocaleString(), 'Status: ' + t.status].join('\n'); }
function downloadReceipt(id) {
  var t = state.tx.filter(function (x) { return x.id === id; })[0]; if (!t) return;
  var html = '<!doctype html><meta charset="utf-8"><title>Receipt ' + esc(t.ref) + '</title><body style="font-family:system-ui;max-width:480px;margin:40px auto;padding:0 16px"><h2>GlobalPay receipt</h2><p style="color:#a16207">Sandbox demo - not a real payment</p><pre style="white-space:pre-wrap;font:15px/1.7 system-ui">' + esc(receiptText(t)) + '</pre></body>';
  var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([html], { type: 'text/html' })); a.download = 'GlobalPay-receipt-' + t.ref + '.html'; document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function shareTx(id) {
  var t = state.tx.filter(function (x) { return x.id === id; })[0]; if (!t) return; var txt = receiptText(t);
  if (navigator.share) navigator.share({ title: 'GlobalPay receipt', text: txt }).catch(function () {});
  else if (navigator.clipboard) navigator.clipboard.writeText(txt).then(function () { toast('Receipt copied to clipboard.'); }, function () { toast('Could not copy.'); });
}
function exportCsv() {
  var rows = [['Date', 'Title', 'Category', 'Amount', 'Currency', 'Status', 'Reference']].concat(mine('tx').map(function (t) { return [t.time, t.title, t.cat, major(t.amt, t.cur), t.cur, t.status, t.ref]; }));
  var csv = rows.map(function (r) { return r.map(function (c) { return '"' + String(c).replace(/"/g, '""') + '"'; }).join(','); }).join('\n');
  var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = 'globalpay-transactions.csv'; document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

if (window.matchMedia) { try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { if (state.theme === 'system') applyTheme(); }); } catch (e) {} }
lastRoute = route().name;
if (route().name === 'send' || route().name === 'pay') ui.flow = newFlow(route().name === 'pay' ? 'contact' : 'intl', route().q.country);
render();
window.addEventListener('load', function () { if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {}); });
})();
</script>
