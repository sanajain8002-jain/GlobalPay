      function formatMinor(minor, currency = 'USD', respectMask = false) {
        if (respectMask && state.hideBalances) return '••••••••';
        const meta = CURRENCIES[currency] || { symbol: currency + ' ', decimals: 2 };
        const n = Math.trunc(Number(minor) || 0);
        const sign = n < 0 ? '-' : '';
        const abs = Math.abs(n);
        if (meta.decimals === 0) {
          return `${sign}${meta.symbol}${abs.toLocaleString('en-US')}`;
        }
        const whole = Math.floor(abs / Math.pow(10, meta.decimals));
        const frac = String(abs % Math.pow(10, meta.decimals)).padStart(meta.decimals, '0');
        return `${sign}${meta.symbol}${whole.toLocaleString('en-US')}.${frac}`;
      }

      function getRate(fromCurr, toCurr) {

        const found = state.users.find(u => u.email.toLowerCase() === email && u.passwordPlain === pass);

          toast('Authentication Failed', 'Invalid email or password. Use one of the seeded demo accounts or register a new user.', 'error');
          return;

        state.currentUserId = found.id;
        state.currentScreen = 'dashboard';
        recordAudit('USER_LOGIN', found.id, 'SUCCESS', { email });

        toast('Welcome back, ' + found.fullName, 'Authenticated session established.', 'success');

      function executeSandboxPayment(params) {
        const u = currentUser();
        const idemComposite = `${u.id}:${params.idempotencyKey}`;
        if (state.idempotencyKeys[idemComposite]) {
          const existingTxId = state.idempotencyKeys[idemComposite];
          state.selectedTxId = existingTxId;
          toast('Idempotent Replay Prevented', `Duplicate key ${params.idempotencyKey} detected; returning existing transaction without double-debiting.`, 'warn');
          state.currentScreen = 'payment_result';
          saveState();
          renderAll();
          return;
        }

        const acc = state.accounts.find(a => a.userId === u.id && a.currency === params.sourceCurrency);
        if (!acc) {
          toast('Account Not Found', `No ${params.sourceCurrency} account available.`, 'error');
          return;
        }

        const totalDebit = params.totalDebitedMinor || params.amountMinor;
        if (params.type === 'DOMESTIC_P2P' && totalDebit > 1000000) {
          toast('Limit Exceeded', 'Domestic single transaction limit is $10,000.00.', 'error');
          return;
        }
        if (acc.balanceMinor < totalDebit) {
          toast('Insufficient Sandbox Funds', `Required ${formatMinor(totalDebit, params.sourceCurrency)}, available ${formatMinor(acc.balanceMinor, params.sourceCurrency)}.`, 'error');
          return;
        }

        const finalState = params.simMode || 'COMPLETED';
        if (finalState !== 'FAILED') {
          acc.balanceMinor -= totalDebit;
        }

        const txId = 'tx_' + Math.random().toString(36).slice(2, 8);
        const refCode = 'GP-SBX-20261025-' + Math.random().toString(36).slice(2, 8).toUpperCase();
        const now = new Date().toISOString();
        const events = [
          { from: 'DRAFT', to: 'REQUIRES_AUTHORIZATION', actor: 'SYSTEM', reason: 'Validated parameters & limits', time: now },
          { from: 'REQUIRES_AUTHORIZATION', to: 'PROCESSING', actor: 'USER', reason: 'Session authorization confirmed', time: now }
        ];
        if (finalState !== 'PROCESSING') {
          events.push({
            from: 'PROCESSING',
            to: finalState,
            actor: 'PROVIDER_WEBHOOK',
            reason: finalState === 'COMPLETED' ? 'Sandbox clearing settlement confirmed' : 'Simulated provider outcome: ' + finalState,
            time: now
          });
        }

        const newTx = {
          id: txId,
          referenceCode: refCode,
          userId: u.id,
          sourceAccountId: acc.id,
          type: params.type,
          state: finalState,
          sourceCurrency: params.sourceCurrency,
          sourceAmountMinor: params.amountMinor,
          feeAmountMinor: params.feeAmountMinor || 0,
          taxAmountMinor: params.taxAmountMinor || 0,
          totalDebitedMinor: totalDebit,
          targetCurrency: params.targetCurrency || params.sourceCurrency,
          targetAmountMinor: params.targetAmountMinor || params.amountMinor,
          exchangeRateUsed: params.exchangeRateUsed || '1.0000',
          spendingCategory: params.spendingCategory || 'Transfers',
          recipientName: params.recipientName,
          recipientIdentifier: params.recipientIdentifier,
          note: params.note || '',
          providerName: 'globalpay_deterministic_sandbox',
          providerReference: 'SBX-PRV-' + Math.random().toString(36).slice(2, 10).toUpperCase(),
          idempotencyKey: params.idempotencyKey,
          createdAt: now,
          events
        };

        state.transactions.unshift(newTx);
        state.idempotencyKeys[idemComposite] = txId;
        state.selectedTxId = txId;
        pushNotification(u.id, 'PAYMENT_OUTCOME', `Sandbox ${finalState}: ${formatMinor(newTx.targetAmountMinor, newTx.targetCurrency)}`, `Ref ${refCode} to ${newTx.recipientName}`);
        recordAudit('PAYMENT_' + finalState, refCode, finalState === 'FAILED' ? 'FAILURE' : 'SUCCESS', { totalDebit, currency: params.sourceCurrency });

        state.currentScreen = 'payment_result';
        saveState();
        toast(`Transaction ${finalState}`, `Reference ${refCode} recorded.`, finalState === 'FAILED' ? 'error' : 'success');
        renderAll();
      }

      window.gpGenerateTransferQuote = function (e) {
        e.preventDefault();
        const u = currentUser();
        const src = document.getElementById('intl-src-curr').value;
        const tgt = document.getElementById('intl-tgt-curr').value;
        const amountMajor = parseFloat(document.getElementById('intl-send-amount').value);
        const sendMinor = Math.round(amountMajor * 100);
        const benId = document.getElementById('intl-beneficiary').value;

        const corridor = state.corridors.find(c => c.sourceCurrency === src && c.targetCurrency === tgt && c.enabled);
        if (!corridor) {
          toast('Corridor Not Transferable', `Pair ${src} → ${tgt} is indicative-display only or disabled in the corridor registry.`, 'error');
          return;
        }
        if (sendMinor < corridor.minMinor || sendMinor > corridor.maxMinor) {
          toast('Corridor Limit Violation', `Amount must be between ${formatMinor(corridor.minMinor, src)} and ${formatMinor(corridor.maxMinor, src)}.`, 'error');
          return;
        }

        const midRate = getRate(src, tgt);
        const custRate = midRate * (1 - corridor.fxMarkupBps / 10000);
        const fixedFeeMinor = corridor.fixedFeeMinor;
        const variableFeeMinor = Math.round((sendMinor * corridor.pctFeeBps) / 10000);
        const taxAmountMinor = Math.round((sendMinor * corridor.taxBps) / 10000);
        const totalFeeMinor = fixedFeeMinor + variableFeeMinor + taxAmountMinor;
        const totalPayableMinor = sendMinor + totalFeeMinor;

        const tgtDecimals = CURRENCIES[tgt]?.decimals ?? 2;
        const recipientAmountMinor = Math.round(amountMajor * custRate * Math.pow(10, tgtDecimals));

        const qId = 'qte_' + Math.random().toString(36).slice(2, 8);
        const quote = {
          id: qId,
          userId: u.id,
          beneficiaryId: benId,
          sourceCurrency: src,
          targetCurrency: tgt,
          sendAmountMinor: sendMinor,
          fixedFeeMinor,
          variableFeeMinor,
          taxAmountMinor,
          totalFeeMinor,
          totalPayableMinor,
          midMarketRate: midRate.toFixed(4),
          customerRate: custRate.toFixed(4),
          fxMarkupBps: corridor.fxMarkupBps,
          recipientAmountMinor,
          delivery: corridor.delivery,
          expiresAt: new Date(Date.now() + 5 * 60 * 1000).toISOString(),
          acceptedAt: null
        };
        state.quotes.unshift(quote);
        state.activeQuoteId = qId;
        state.currentScreen = 'quote_review';
        saveState();
        toast('Transfer Quote Generated', `Locked customer rate 1 ${src} = ${custRate.toFixed(4)} ${tgt} for 5 minutes.`, 'success');
        renderAll();
      };

            <div class="space-y-2">
              <div class="text-xs font-bold uppercase tracking-wider text-slate-400">Validated State Machine Event Log</div>
              ${(tx.events || []).map(ev => `

                  <div>
                    <span class="font-mono font-bold text-purple-400">${ev.from} → ${ev.to}</span>
                    <span class="ml-2 text-slate-500">(${ev.actor}: ${ev.reason})</span>
                  </div>
                  <span class="font-mono text-[10px] text-slate-400">${ev.time}</span>
                </div>
              `).join('')}

              ${tx.state === 'PROCESSING' || tx.state === 'REQUIRES_INVESTIGATION' ? `
                <button type="button" onclick="window.gpReconcileTransaction('${tx.id}', 'COMPLETED')" class="px-4 py-2 rounded-xl bg-emerald-600 text-white text-xs font-semibold">Simulate Webhook Settlement (COMPLETED)</button>
              ` : ''}
              ${tx.state === 'COMPLETED' ? `

      window.gpReconcileTransaction = function (txId, targetState) {
        const tx = state.transactions.find(t => t.id === txId);
        if (!tx) return;
        const old = tx.state;
        tx.state = targetState;
        tx.events.push({
          from: old,
          to: targetState,
          actor: 'PROVIDER_WEBHOOK',
          reason: 'Reconciled via verified provider settlement event',
          time: new Date().toISOString()
        });
        saveState();
        toast('Transaction Reconciled', `${tx.referenceCode} transitioned ${old} → ${targetState}.`, 'success');
        renderAll();
      };

      window.gpRefundTransaction = function (txId) {
        const tx = state.transactions.find(t => t.id === txId);
        if (!tx || tx.state !== 'COMPLETED') return;
        tx.state = 'REFUNDED';
        tx.events.push(
          { from: 'COMPLETED', to: 'REFUND_PENDING', actor: 'USER', reason: 'Refund requested', time: new Date().toISOString() },
          { from: 'REFUND_PENDING', to: 'REFUNDED', actor: 'PROVIDER_WEBHOOK', reason: 'Sandbox funds credited back to source account', time: new Date().toISOString() }
        );
        const acc = state.accounts.find(a => a.id === tx.sourceAccountId);
        if (acc) acc.balanceMinor += tx.totalDebitedMinor;
        recordAudit('TRANSACTION_REFUNDED', tx.referenceCode, 'SUCCESS', { amountMinor: tx.totalDebitedMinor });
        saveState();
        toast('Transaction Refunded', `Credited ${formatMinor(tx.totalDebitedMinor, tx.sourceCurrency)} back to account and excluded from active spend analytics.`, 'info');
        renderAll();
      };

      function renderReceiptScreen() {

        return `

      window.gpOpenReceipt = function (txId) {

      window.gpDownloadReceiptFile = function (txId) {
        const tx = state.transactions.find(t => t.id === txId) || state.transactions[0];
        if (!tx) return;
        const lines = [
          '============================================================',
          'GLOBALPAY 2.0 — OFFICIAL SANDBOX TRANSACTION RECEIPT',
          'ENVIRONMENT: SANDBOX SIMULATION (FICTIONAL FUNDS ONLY)',
          '============================================================',
          `Receipt Reference   : ${tx.referenceCode}`,
          `Provider Reference  : ${tx.providerReference}`,
          `Transaction State   : ${tx.state}`,
          `Created Timestamp   : ${tx.createdAt}`,
          `Recipient           : ${tx.recipientName} (${tx.recipientIdentifier})`,
          `Source Amount       : ${formatMinor(tx.sourceAmountMinor, tx.sourceCurrency)} ${tx.sourceCurrency}`,
          `Fees & Taxes        : ${formatMinor(tx.feeAmountMinor + tx.taxAmountMinor, tx.sourceCurrency)} ${tx.sourceCurrency}`,
          `Total Debited       : ${formatMinor(tx.totalDebitedMinor, tx.sourceCurrency)} ${tx.sourceCurrency}`,
          `Recipient Amount    : ${formatMinor(tx.targetAmountMinor, tx.targetCurrency)} ${tx.targetCurrency}`,
          `Exchange Rate Used  : ${tx.exchangeRateUsed}`,
          `Idempotency Key     : ${tx.idempotencyKey}`,
          '============================================================'
        ].join('\n');
        const blob = new Blob([lines], { type: 'text/plain;charset=utf-8' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `${tx.referenceCode}-receipt.txt`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        toast('Receipt Downloaded', `Saved ${tx.referenceCode}-receipt.txt`, 'success');
      };

      window.gpCopyShareReceiptLink = function (refCode) {
        const shareUrl = `https://sandbox.globalpay.app/r/${refCode}?privacy=redacted`;
        try {
          const input = document.createElement('textarea');
          input.value = shareUrl;
          document.body.appendChild(input);
          input.select();
          document.execCommand('copy');
          input.remove();
        } catch (_e) {}
        toast('Shareable Receipt Link Copied', `Copied privacy-safe link (${shareUrl}) excluding account balances.`, 'info');
      };

              <div>
                <label class="block text-[11px] font-medium mb-1">Lifecycle State</label>
                <select onchange="window.gpUpdateActivityFilter('state', this.value)" class="w-full px-3 py-1.5 rounded-xl text-xs bg-slate-100 dark:bg-gp-bg border border-slate-300 dark:border-gp-border">

                <select onchange="window.gpUpdateActivityFilter('currency', this.value)" class="w-full px-3 py-1.5 rounded-xl text-xs bg-slate-100 dark:bg-gp-bg border border-slate-300 dark:border-gp-border">
                  <option value="ALL" ${f.currency === 'ALL' ? 'selected' : ''}>All Currencies</option>

            <div class="glass-panel rounded-2xl p-5 overflow-x-auto">

        const refundedTxs = state.transactions.filter(t => t.userId === u.id && t.state === 'REFUNDED');

      function mountSpendChart() {
        const canvas = document.getElementById('spend-analytics-chart');
        if (!canvas || typeof Chart === 'undefined') return;
        if (activeChartInstance) {
          activeChartInstance.destroy();
          activeChartInstance = null;
        }
        const u = currentUser();
        const completedTxs = state.transactions.filter(t => t.userId === u.id && t.state === 'COMPLETED' && t.type !== 'SANDBOX_TOPUP');
        const byCat = {};
        completedTxs.forEach(t => {
          byCat[t.spendingCategory] = (byCat[t.spendingCategory] || 0) + t.totalDebitedMinor / 100;
        });
        const labels = Object.keys(byCat);
        const values = Object.values(byCat);

        activeChartInstance = new Chart(canvas, {
          type: 'bar',
          data: {
            labels: labels.length ? labels : ['No Completed Spend'],
            datasets: [{
              label: 'Completed Spend (USD)',
              data: values.length ? values : [0],
              backgroundColor: ['#8B5CF6', '#6D28D9', '#10B981', '#F59E0B', '#EC4899'],
              borderRadius: 8
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              y: { beginAtZero: true, ticks: { color: '#C4B5FD' } },
              x: { ticks: { color: '#C4B5FD' } }
            }
          }
        });
      }

      window.gpExportSpendCsv = function () {
        const u = currentUser();
        const rows = [['Reference', 'Date', 'Type', 'State', 'Category', 'Recipient', 'DebitedMinor', 'Currency']];
        state.transactions.filter(t => t.userId === u.id).forEach(t => {
          rows.push([t.referenceCode, t.createdAt, t.type, t.state, t.spendingCategory, t.recipientName, t.totalDebitedMinor, t.sourceCurrency]);
        });
        const csv = rows.map(r => r.join(',')).join('\n');
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `GlobalPay-${u.handle}-spend-summary.csv`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        toast('CSV Summary Exported', 'Downloaded ledger financial summary.', 'success');
      };

      window.gpSaveBudget = function (e) {
        e.preventDefault();
        const u = currentUser();

          existing.limitMinor = limitMinor;
          existing.thresholdPct = thresholdPct;

          state.budgets.push({ id: 'bdg_' + Date.now(), userId: u.id, category, currency: 'USD', limitMinor, thresholdPct, month: '2026-10' });

        saveState();
        toast('Budget Saved', `Updated ${category} monthly cap to ${formatMinor(limitMinor, 'USD')}.`, 'success');

      window.gpAskCopilot = function (queryText) {
        const u = currentUser();
        state.copilotHistory.push({ role: 'user', text: queryText });
        const q = queryText.toLowerCase();
        const txs = state.transactions.filter(t => t.userId === u.id);
        const completed = txs.filter(t => t.state === 'COMPLETED' && t.type !== 'SANDBOX_TOPUP');
        const totalMinor = completed.reduce((acc, t) => acc + t.totalDebitedMinor, 0);

        let reply = '';
        if (q.includes('spend') || q.includes('summar') || q.includes('budget')) {
          reply = `For ${u.fullName}, you have ${completed.length} completed spend transactions totaling ${formatMinor(totalMinor, 'USD')} USD. Refunded and pending items are excluded from your spend total.`;
        } else if (q.includes('fee') || q.includes('corridor') || q.includes('compare')) {
          reply = `USD → INR (IMPS/UPI Sandbox) charges $2.99 fixed + 0.45% variable fee + 35 bps FX markup. USD → GBP (Faster Payments) charges $1.99 fixed + 0.35% variable fee + 25 bps FX markup.`;
        } else if (q.includes('unusual') || q.includes('pending') || q.includes('flag')) {
          const pending = txs.filter(t => t.state === 'PROCESSING' || t.state === 'REQUIRES_INVESTIGATION');
          reply = pending.length
            ? `Advisory Review Flag: You have ${pending.length} transaction(s) in ${pending[0].state} state (${pending[0].referenceCode} for ${formatMinor(pending[0].totalDebitedMinor, pending[0].sourceCurrency)}). Note: Copilot provides informational review flags only and never makes automated fraud determinations.`
            : `No pending or unusual transactions detected in your ledger.`;
        } else {
          reply = `Scoped Copilot Response: Your active USD balance is ${formatMinor(state.accounts.find(a => a.userId === u.id && a.currency === 'USD')?.balanceMinor || 0, 'USD')}. Remember I am a read-only assistant and cannot execute or approve transfers on your behalf.`;
        }
        state.copilotHistory.push({ role: 'assistant', text: reply });
        saveState();
        renderAll();
      };

      function renderAll() {
        renderShellHeader();
        window.gpRenderNav();
        const viewport = document.getElementById('screen-viewport');
        if (!viewport) return;

        const renderers = {
          welcome: renderWelcomeScreen,
          auth: renderAuthScreen,
          dashboard: renderDashboardScreen,
          qr: renderQrScreen,
          domestic: renderDomesticScreen,
          requests: renderRequestsScreen,
          splits: renderSplitsScreen,
          intl: renderIntlScreen,
          converter: renderConverterScreen,
          recipients: renderRecipientsScreen,
          quote_review: renderQuoteReviewScreen,
          payment_result: renderPaymentResultScreen,
          receipt: renderReceiptScreen,
          activity: renderActivityScreen,
          insights: renderInsightsScreen,
          budgets: renderBudgetsScreen,
          notifications: renderNotificationsScreen,
          profile: renderProfileScreen,
          copilot: renderCopilotScreen,
          corridors: renderCorridorsScreen,
          support: renderSupportScreen,
          admin: renderAdminScreen,
          publish_hub: renderPublishHubScreen
        };

        const fn = renderers[state.currentScreen] || renderDashboardScreen;
        viewport.innerHTML = fn();

        if (state.currentScreen === 'insights') {
          setTimeout(mountSpendChart, 20);
        }
        if (window.lucide && typeof window.lucide.createIcons === 'function') {
          window.lucide.createIcons();
        }
      }

      window.addEventListener('DOMContentLoaded', () => {
        renderAll();
      });
      renderAll();
    })();
  </script>
