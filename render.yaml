databases:
  - name: globalpay-postgres
    databaseName: globalpay_db
    user: globalpay_user
    plan: free

services:
  # 1. Node.js /api/v1 Backend API Service
  - type: web
    name: globalpay-2-api
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: node server/src/runtime.mjs
    healthCheckPath: /api/v1/system/health/liveness
    envVars:
      - key: NODE_ENV
        value: development
      - key: PORT
        value: 4000
      - key: PAYMENT_PROVIDER_MODE
        value: sandbox
      - key: DATABASE_URL
        fromDatabase:
          name: globalpay-postgres
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: CSRF_SECRET
        generateValue: true
      - key: PAYMENT_WEBHOOK_SECRET
        generateValue: true

  # 2. GlobalPay 2.0 Live Website (Static Web App)
  - type: web
    name: globalpay-2-web
    runtime: static
    buildCommand: echo "Static bundle ready"
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
